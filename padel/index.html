<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PadelUp</title>
<meta name="theme-color" content="#1F5FD6">
<meta name="description" content="Werde besser im Padel – Lektionen, Match-Missionen und Trainingstagebuch, gamifiziert.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PadelUp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: schmale App-Spalte (max. 640px) – Kopfleiste, scrollender Inhalt, Navigation unten. Farben: Court-Blau, Ball-Gelbgrün, Glas. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#E9EEF7; --line:#D8DFEC;
  --fg:#14203A; --muted:#58637F;
  --accent:#1F5FD6; --accent-ink:#FFFFFF;
  --ball:#C9E52B; --ball-ink:#22300A;
  --gold:#F2B705; --gold-ink:#3A2A00; --flame:#FF7A1A;
  --good:#1A9A5E; --good-bg:#DDF5E8; --bad:#D23A3A; --bad-bg:#FCE4E4;
  --locked:#CFD5E3; --locked-ink:#8A93AD; --scrim:rgba(12,16,34,.55);
  --u1:#1A9A5E; --u2:#1F5FD6; --u3:#7A4CC2; --u4:#C8650A; --u5:#C8372A; --u6:#0F7F92;
  --font-display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1220; --surface:#141C2F; --surface-2:#1B253D; --line:#2A3654; --fg:#E7ECF7; --muted:#9CA7C4;
    --accent:#6B9BF7; --accent-ink:#0C1220; --good:#3DCB86; --good-bg:#11372A; --bad:#FF6B6B; --bad-bg:#421A1E;
    --locked:#2A3453; --locked-ink:#6E7899; --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C2F; --surface-2:#1B253D; --line:#2A3654; --fg:#E7ECF7; --muted:#9CA7C4;
  --accent:#6B9BF7; --accent-ink:#0C1220; --good:#3DCB86; --good-bg:#11372A; --bad:#FF6B6B; --bad-bg:#421A1E;
  --locked:#2A3453; --locked-ink:#6E7899; --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
svg{flex:none}

.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:8px 12px;border-bottom:2px solid var(--line)}
.stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:18px;background:none;border:0;padding:6px 8px;border-radius:12px;font-variant-numeric:tabular-nums}
.stat:hover{background:var(--surface-2)}
.stat svg{width:26px;height:26px}
.c-flame{color:var(--flame)} .c-ball{color:var(--ball)} .c-gold{color:var(--gold)} .c-acc{color:var(--accent)} .c-good{color:var(--good)}
.stat.off .c-flame{color:var(--locked-ink)}
.ring{width:30px;height:30px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 40px;scroll-behavior:smooth}
.nav{display:flex;gap:4px;border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;position:relative}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 4px}

/* Buttons */
.btn{--b:var(--accent);--ink:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 20px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--b);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--b) 62%,#000);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 color-mix(in srgb,var(--b) 62%,#000)}
.btn:disabled{--b:var(--locked);--ink:var(--locked-ink);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.good{--b:var(--good);--ink:#fff}
.btn.bad{--b:var(--bad);--ink:#fff}
.btn.gold{--b:var(--gold);--ink:var(--gold-ink)}
.btn.ball{--b:var(--ball);--ink:var(--ball-ink)}
.btn svg{width:20px;height:20px}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:8px}
.linkbtn:hover{color:var(--accent)}

/* Allgemein */
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.row > .grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .b{font-weight:800}
.sec-title{font-size:22px;margin:22px 0 12px}
.sec-title:first-child{margin-top:4px}
.sec-sub{color:var(--muted);font-weight:700;margin:-6px 0 14px;font-size:14px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.bar{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .5s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.4)}
.bar.green i{background:var(--good)} .bar.blue i{background:var(--accent)} .bar.ball i{background:var(--ball)}
.bar.thin{height:10px}
.bar.thin i::after{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--fg)}
.chip svg{width:14px;height:14px}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.ball{background:color-mix(in srgb,var(--ball) 35%,transparent)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent));flex:none}
.ic svg{width:26px;height:26px}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .mascot{width:96px;height:96px}

/* Hero */
.hero{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px}
.hero .mascot{width:84px;height:84px}
.hero-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero-body p{font-weight:700}
.goal{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px;width:100%;text-align:left}
.mini h3{font-size:16px;font-family:var(--font-body);font-weight:900}
.mini p{font-size:13px;color:var(--muted);font-weight:700}
.mini.done{opacity:.7}
.mini .go{color:var(--muted)}
.mini .go svg{width:22px;height:22px}

/* Lernpfad */
.unit{margin:26px 0 28px}
.unit-head{background:var(--c);color:#fff;border-radius:20px;padding:14px 16px 14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000)}
.unit-head h2{font-size:22px;margin-top:2px}
.unit-head .sub{font-size:13px;font-weight:700;opacity:.9}
.unit-head .eyebrow{opacity:.85}
.unit-prog{font-family:var(--font-display);font-weight:700;font-size:15px;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;white-space:nowrap}
.unit.locked .unit-head{--c:var(--locked);color:var(--locked-ink)}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:58px 10px}
.nodewrap{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center}
.node{scroll-margin:140px 0 60px;position:relative;width:74px;height:68px;border-radius:50%;border:0;background:var(--c);color:#fff;box-shadow:0 7px 0 color-mix(in srgb,var(--c) 58%,#000);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node svg{width:34px;height:34px}
.node:active:not(.locked){transform:translateY(6px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 58%,#000)}
.node.locked{--c:var(--locked);color:var(--locked-ink)}
.node.chest{border-radius:22px;width:78px;--c:var(--gold);color:var(--gold-ink)}
.node.chest.locked{--c:var(--locked)}
.node.chest.done{opacity:.55}
.node.test{width:86px;height:78px}
.node.mastered{--c:var(--gold);color:var(--gold-ink)}
.node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:6px solid color-mix(in srgb,var(--c) 30%,transparent);animation:ring 1.6s ease-in-out infinite}
.node.chest.current::before{border-radius:28px}
.node .mbadge{position:absolute;top:-6px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--ball);color:var(--ball-ink);display:grid;place-items:center;border:3px solid var(--bg)}
.node .mbadge svg{width:14px;height:14px}
@keyframes ring{50%{inset:-14px;opacity:.5}}
.startbubble{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--c);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.startbubble::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.stars{display:flex;gap:1px;margin-top:12px;color:var(--gold);height:16px}
.stars svg{width:16px;height:16px}
.stars .e{color:var(--locked)}
.stars + .nodelabel{margin-top:4px}
.nodelabel{font-size:12px;font-weight:800;color:var(--muted);margin-top:14px;max-width:120px;text-align:center;line-height:1.2}

/* Roadmap */
.stage{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc) 62%,#000));margin:40px 0 4px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 color-mix(in srgb,var(--sc) 50%,#000)}
.stage h2{font-size:26px}
.stage p{font-weight:700;opacity:.92;font-size:14px}
.stage .bar{background:rgba(255,255,255,.25);flex:none}
.stage .bar i{background:#fff}
.stage .row .btn{--b:#fff;--ink:var(--sc);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.stage.locked{--sc:#8A93AD}
.road{display:flex;gap:6px;margin:6px 0 2px}
.road i{flex:1;height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden;display:block;position:relative}
.road i b{position:absolute;inset:0 auto 0 0;background:var(--rc);border-radius:9px}
.rstage{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.rstage .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--sc);color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px;flex:none}
.rstage.off{opacity:.6}
.msrow{display:flex;gap:12px;align-items:center}
.msrow .ck{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.msrow .ck.on{background:var(--good);border-color:var(--good)}
.msrow .ck svg{width:18px;height:18px}

/* Missionen */
.mission{border:2px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
.mission .mh{display:flex;gap:12px;align-items:center;padding:14px 16px;background:color-mix(in srgb,var(--ball) 22%,var(--surface))}
.mission .mh h3{font-size:18px}
.mission .mb{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.mission .mb p{font-weight:700}
.tries{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.tries i{width:14px;height:14px;border-radius:50%;background:var(--surface-2);display:block}
.tries i.r1{background:var(--locked-ink)} .tries i.r2{background:var(--gold)} .tries i.r3{background:var(--good)}
.plan{background:#1F5FD6;color:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.plan h2{font-size:22px}
.plan ol{margin:0;padding-left:20px;font-weight:700;display:flex;flex-direction:column;gap:6px}
.plan .btn{--b:#fff;--ink:#1F5FD6;box-shadow:0 4px 0 rgba(0,0,0,.25)}

/* Tagebuch */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sg{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0;background:var(--surface)}
.sg svg{width:26px;height:26px}
.sg b{display:block;font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sg span{font-size:13px;color:var(--muted);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:18px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .col i{display:block;width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.chart .col i.now{background:var(--ball)}
.chart .col em{font-style:normal;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .col span{font-size:11px;font-weight:800;color:var(--muted)}
.radar{width:100%;max-width:340px;display:block;margin:0 auto}
.radar text{font-family:var(--font-body);font-size:11px;font-weight:800;fill:var(--muted)}
.entry{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:2px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.entry:first-child{border-top:0}
.entry h3{font-size:16px;font-family:var(--font-body);font-weight:900}
.entry p{font-size:13px;color:var(--muted);font-weight:700}
.res{font-family:var(--font-display);font-weight:700;font-size:13px;padding:3px 8px;border-radius:8px}
.res.w{background:var(--good-bg);color:var(--good)} .res.l{background:var(--bad-bg);color:var(--bad)} .res.d{background:var(--surface-2);color:var(--muted)}

/* Formulare */
.kcal{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--flame) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--flame) 35%,transparent);border-radius:16px;padding:12px 14px}
.kcal svg{width:30px;height:30px}
.kcal b{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kcal span{font-size:13px;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.seg.big button{padding:12px 14px;font-size:15px}
.field{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-weight:700}
textarea.field{min-height:84px;resize:vertical}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:400}
.lab{display:block;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rate{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center}
.rate span{font-size:14px;font-weight:800}
.dots{display:flex;gap:6px}
.dots button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:900;font-size:13px;color:var(--muted)}
.dots button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Statistik & Material */
.subtabs{margin:-4px 0 16px}
.subtabs button{flex:1;position:relative}
.dot2{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-style:normal;padding:0 4px;margin-left:2px}
.wld{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.wld b{display:block;font-family:var(--font-display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.wld span{font-size:12px;font-weight:800;color:var(--muted)}
.wlbar{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.wlbar i{display:block;height:100%}
.form{display:flex;gap:5px;flex-wrap:wrap}
.fm{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;color:#fff}
.fm.w{background:var(--good)} .fm.l{background:var(--bad)} .fm.d{background:var(--locked-ink)}
.trow{display:flex;align-items:center;gap:10px}
.trow .pct{font-family:var(--font-display);font-weight:600;width:48px;text-align:right;color:var(--accent)}
.skr{display:flex;align-items:center;gap:10px}
.skr .ic{width:38px;height:38px;border-radius:12px}
.skr .ic svg{width:20px;height:20px}
.skr .score{font-family:var(--font-display);font-size:20px;font-weight:600;width:36px;text-align:right;font-variant-numeric:tabular-nums}
.spark{width:90px;height:30px;flex:none}
.rr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.rr label{font-weight:800;font-size:14px}
.rr input{grid-column:1/3;width:100%;accent-color:var(--accent);height:28px}
.rr.unset input{opacity:.3}
.rr.unset label{color:var(--muted)}
.rq{font-weight:800;font-size:14px;color:var(--muted)}
.rr.unset{display:block}
.rr.r3{grid-template-columns:1fr auto auto}
.rr.r3 input{grid-column:1/4}
.rr.r3 .np{grid-column:auto;padding:3px 10px;font-size:12px}
.seg.two{margin-top:6px}
.seg.two button{display:inline-flex;align-items:center;gap:4px}
.seg.two button svg{width:14px;height:14px}
.np{grid-column:1/3;justify-self:start;display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--muted)}
.np svg{width:14px;height:14px}
.np[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);border-color:var(--locked-ink)}
.rv{border:2px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;height:32px;font-family:var(--font-display);font-weight:600;font-size:17px}
.rr:not(.unset) .rv{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gear.due{border-color:var(--flame)}
.rspecs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rspecs div{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.rspecs span{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rspecs b{font-size:15px}
.why{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px}

.rsvg{width:58px;height:88px;flex:none}
.rshape{width:56px;height:76px;flex:none;background:var(--accent);position:relative}
.rshape::after{content:"";position:absolute;left:50%;bottom:-18px;width:10px;height:22px;background:var(--fg);border-radius:4px;transform:translateX(-50%)}
.rshape.s0{border-radius:50%/48%}
.rshape.s1{border-radius:50% 50% 46% 46%/62% 62% 38% 38%}
.rshape.s2{clip-path:polygon(50% 0,100% 38%,86% 100%,14% 100%,0 38%);border-radius:0}
.racket .row:first-child{margin-bottom:14px}

/* Schläger */
.rwin{background:#1F5FD6;color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.rwin h2{font-size:28px}
.rwin .rsvg{color:#fff}
.rwin .btn{--b:#fff;--ink:#1F5FD6;box-shadow:0 4px 0 rgba(0,0,0,.25);text-decoration:none}
.rwin .reasons li::before{background:var(--ball)}
.rprice{font-family:var(--font-display);font-size:26px;font-weight:600}
.bigpct{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:.9;text-align:right;font-variant-numeric:tabular-nums}
.bigpct small{display:block;font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.sheet .bigpct{color:var(--accent);font-size:38px}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px}
.reasons li{display:flex;gap:8px;align-items:baseline}
.reasons li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--good)}
.reasons li.warn::before{background:transparent;border:2px solid currentColor;width:6px;height:6px}
.sheet .reasons li.warn{color:var(--bad)}
.rruns{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px}
@media (min-width:560px){.rruns{grid-template-columns:1fr 1fr}}
.rrun{display:flex;gap:8px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px;min-width:0}
.rrun .grow{min-width:0;display:flex;flex-direction:column}
.rrun b{font-size:15px;line-height:1.2}
.rrun small{font-size:11px;color:var(--muted);font-weight:800}
.pctS{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--accent)}
.rkrow{display:grid;grid-template-columns:24px minmax(0,1fr) 56px 26px;gap:8px;align-items:center;text-align:left;background:none;border:0;padding:6px 4px;border-radius:10px;width:100%}
.rkrow:hover{background:var(--surface-2)}
.rkrow.mine{background:color-mix(in srgb,var(--ball) 25%,transparent)}
.rkrow .rk{color:var(--muted);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.rkrow .nm{min-width:0}
.rkrow .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkrow .nm small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.rkrow .num,.abars .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:800;text-align:right;font-size:13px}
.abars{display:grid;grid-template-columns:auto minmax(0,1fr) 32px;gap:6px 10px;align-items:center;font-size:13px;font-weight:800}
.tune summary{cursor:pointer;font-size:16px}
.rr .ends{grid-column:1/3;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-top:-4px}
.rr b.rv{display:grid;place-items:center;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rr.unset b.rv{background:var(--surface);border-color:var(--line);color:var(--muted)}

/* Entwicklung */
.devwrap{position:relative}
.dev{width:100%;display:block;overflow:visible}
.dev .ax{font-family:var(--font-body);font-size:11px;font-weight:700;fill:var(--muted)}
.dev .ax.b{font-weight:900}
.dev .hit{cursor:pointer}
.devtip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;flex-direction:column;max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:2}
.devtip b{font-weight:900}
.devchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.devchips button{flex:none}
.devtab{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.devtab th,.devtab td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.devtab th{color:var(--muted);font-size:12px}
.skr{cursor:pointer;border-radius:12px}
.skr:hover{background:var(--surface-2)}

/* Animationen */
.anim{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.anim svg{width:100%;display:block}
.anim .plbl{font-family:var(--font-body);font-size:10px;font-weight:900;fill:var(--fg)}
.anim .plbl.m{fill:var(--muted);font-weight:800}
.acap{min-height:42px;font-weight:800;font-size:15px;margin:0}
.astep{color:var(--accent);margin-right:4px}
.peek{margin-left:auto;float:right;display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:900;color:var(--accent)}
.peek svg{width:14px;height:14px}
.vbtn{align-self:flex-start;text-decoration:none}
.rrun>span>svg{width:22px;height:22px}

/* Extras */
.lvlbig{font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.lvlbig small{font-size:16px;color:var(--muted)}
.ins{display:flex;gap:10px;align-items:center}
.ins p{margin:0;font-weight:700;font-size:14px}
.ins .ic{width:38px;height:38px;border-radius:12px}.ins .ic svg{width:20px;height:20px}
.tl{display:flex;flex-direction:column;gap:10px}
.tlb{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start;border-left:3px solid var(--accent);padding-left:10px}
.tlm{font-family:var(--font-display);font-weight:600;color:var(--accent);font-size:14px}
.tlb b{font-size:15px}.tlb p{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:700}
.timer{font-family:var(--font-display);font-size:84px;font-weight:700;text-align:center;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.timer.over{color:var(--good)}
.goalc.done{border-color:var(--gold)}
.qbtns{display:grid;grid-template-columns:1fr auto;gap:10px}

/* Liga */
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font-weight:800}
.lrow.me{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.lrank{width:28px;text-align:center;font-family:var(--font-display);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.lrank.top{color:var(--good)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;flex:none}
.lxp{font-variant-numeric:tabular-nums;color:var(--muted)}
.zone{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:6px 4px}
.zone::before,.zone::after{content:"";flex:1;height:2px;background:currentColor;opacity:.4}
.zone.up{color:var(--good)} .zone.down{color:var(--bad)}
.tiers{display:flex;gap:10px;justify-content:center;margin:6px 0 16px;flex-wrap:wrap}
.tier{width:44px;height:50px;display:grid;place-items:center;color:var(--tc);opacity:.35}
.tier.on{opacity:1;transform:scale(1.2)}
.tier svg{width:40px;height:44px}

/* Profil */
.profile-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.profile-head .mascot{width:110px;height:110px;background:var(--surface-2);border-radius:28px;padding:6px}
.lvl-badge{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.skill{display:flex;gap:12px;align-items:center}
.skill .ic{width:40px;height:40px;border-radius:12px}
.skill .ic svg{width:22px;height:22px}
.skill .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.skill .bar{flex:none}
.skill h3{font-size:15px;font-family:var(--font-body);font-weight:900;display:flex;justify-content:space-between;gap:8px}
.skill h3 em{font-style:normal;font-family:var(--font-display);font-weight:600;color:var(--accent);white-space:nowrap}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.achc{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.achc .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--gold)}
.achc .medal svg{width:24px;height:24px}
.achc.off{opacity:.55}
.achc.off .medal{background:var(--locked);color:var(--locked-ink)}
.achc h3{font-size:15px}
.achc p{font-size:12px;color:var(--muted);font-weight:700}
.item{display:flex;align-items:center;gap:14px}
.item .pic{width:64px;height:64px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.item .pic svg{width:40px;height:40px}
.item .pic .mascot{width:60px;height:60px}
.item h3{font-size:17px;font-family:var(--font-body);font-weight:800}
.item p{font-size:14px;color:var(--muted)}

/* Lektion */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:760px;width:100%;margin:0 auto}
.l-top .bar{height:18px}
.l-top .bar i{background:var(--good)}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px;border-radius:10px;display:grid;place-items:center}
.iconbtn svg{width:26px;height:26px}
.iconbtn:hover{background:var(--surface-2)}
.combo{height:28px;display:flex;justify-content:center;align-items:center}
.combo span{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--flame);letter-spacing:.04em;text-transform:uppercase;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.combo svg{width:20px;height:20px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.l-body{flex:1;overflow-y:auto;padding:4px 16px 24px}
.l-inner{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.l-inner.locked{pointer-events:none}
.ex-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--accent))}
.ex-eyebrow svg{width:18px;height:18px}
.ex-title{font-size:25px;font-weight:700}
.theory{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.theory ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.theory li{display:flex;gap:10px;font-size:17px;font-weight:700;line-height:1.4}
.theory li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--ball);border:2px solid color-mix(in srgb,var(--ball) 60%,#000);flex:none;margin-top:6px}
.protip{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--ball) 22%,var(--surface));border-radius:18px;padding:14px}
.protip .mascot{width:58px;height:58px;flex:none}
.protip b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.protip p{font-weight:700}
.say{display:flex;align-items:flex-end;gap:10px}
.say .mascot{width:84px;height:84px;flex:none}
.saybub{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:18px;font-weight:800;margin-bottom:16px;min-width:0;background:var(--surface)}
.saybub::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);font-size:17px;font-weight:700;transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt .k{display:inline-grid;place-items:center;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted);flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.opt[aria-pressed="true"] .k{border-color:var(--accent);color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2 .opt{flex-direction:column;justify-content:center;text-align:center;padding:20px 8px;font-size:18px}
.grid2 .opt svg{width:40px;height:40px}
.seq{min-height:60px;display:flex;flex-direction:column;gap:8px;padding:10px;border:2px dashed var(--line);border-radius:16px}
.seq:empty::before{content:"Tippe die Schritte in der richtigen Reihenfolge an";color:var(--muted);font-weight:700;font-size:14px;text-align:center;padding:8px}
.tile{display:flex;gap:10px;align-items:center;padding:11px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);font-size:16px;font-weight:700;text-align:left;animation:pop .18s;width:100%}
.tile b{font-family:var(--font-display);color:var(--accent);width:20px}
.tile.used{opacity:.3;pointer-events:none}
.l-foot{border-top:2px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transition:background .2s}
.l-foot.good{background:var(--good-bg);border-color:transparent}
.l-foot.bad{background:var(--bad-bg);border-color:transparent}
.foot-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fb{display:flex;gap:12px;align-items:flex-start;animation:pop .25s}
.fb .fic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.fb .fic svg{width:26px;height:26px}
.fb h3{font-size:22px}
.fb p{margin:2px 0 0;font-weight:700}
.l-foot.good .fb{color:var(--good)} .l-foot.bad .fb{color:var(--bad)}
.foot-row{display:flex;gap:10px;align-items:center}
.foot-row .btn{flex:1}

/* Ergebnisse */
.results{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:12px}
.results .mascot{width:140px;height:140px;animation:hop 1s ease-in-out 2}
@keyframes hop{30%{transform:translateY(-16px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.results h1{font-size:30px;color:var(--gold)}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.ts{border:2px solid var(--tc);border-radius:16px;overflow:hidden;background:var(--tc)}
.ts b{display:block;color:#fff;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:5px 2px}
.ts span{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 4px;font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--tc);background:var(--surface);border-radius:13px 13px 0 0;font-variant-numeric:tabular-nums}
.ts span svg{width:20px;height:20px}
.bigstars{display:flex;gap:6px;color:var(--gold)}
.bigstars svg{width:46px;height:46px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars svg:nth-child(2){animation-delay:.15s} .bigstars svg:nth-child(3){animation-delay:.3s}
.bigstars .e{color:var(--locked)}
.mcard{width:100%;text-align:left;border:3px solid var(--ball);border-radius:22px;overflow:hidden;background:var(--surface)}
.mcard .mt{background:var(--ball);color:var(--ball-ink);padding:10px 16px;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.mcard .mt svg{width:20px;height:20px}
.mcard .mbd{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mcard h3{font-size:20px}
.mcard p{font-weight:700}
.streakbig{display:flex;flex-direction:column;align-items:center;gap:6px}
.streakbig svg{width:130px;height:130px;color:var(--flame);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.streakbig .n{font-family:var(--font-display);font-size:68px;font-weight:700;color:var(--flame);line-height:1}

/* Onboarding */
.onb{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.onb h1{font-size:28px}
.onb .hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:30px}
.onb .hello .mascot{width:170px;height:170px;animation:hop 1.2s ease-in-out 2}
.onb .hello h1{font-size:34px}
.choice{display:flex;flex-direction:column;gap:10px}
.choice .opt small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.choice .opt[aria-pressed="true"] small{color:inherit}

/* Modal, Toasts */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:end center;z-index:80;padding:16px}
.sheet{background:var(--surface);color:var(--fg);border-radius:24px;padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;animation:up .25s cubic-bezier(.3,1.3,.5,1);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:24px}
.sheet .center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.sheet .bigic{width:84px;height:84px}
.sheet .mascot{width:110px;height:110px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){.modal{place-items:center}}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(calc(100vw - 32px),420px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:drop .3s cubic-bezier(.3,1.4,.5,1)}
.toast svg{width:22px;height:22px;flex:none}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:120;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:420px){
  .stat{font-size:16px;padding:6px 4px;gap:4px}
  .stat svg{width:22px;height:22px}
  .ex-title{font-size:22px}
  .rate{grid-template-columns:92px 1fr}
  .dots button{width:30px;height:30px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
</div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return today(d);}
function weekKey(s=today()){const d=parseD(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return today(d);}
function hash(str){let h=2166136261;for(const c of String(str)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let s=seed||1;return()=>{s=Math.imul(s^s>>>15,1|s);s^=s+Math.imul(s^s>>>7,61|s);return((s^s>>>14)>>>0)/4294967296;};}
function shuffle(a,r=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function fmtDate(s){const d=parseD(s);const diff=dayDiff(s,today());if(diff===0)return'Heute';if(diff===1)return'Gestern';return WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.';}

function beep(kind){
 if(!S.sound)return;
 try{

  const seqs={ok:[[660,0],[990,.08]],bad:[[220,0],[165,.12]],done:[[523,0],[659,.1],[784,.2],[1046,.32]],coin:[[988,0],[1319,.07]],tap:[[520,0]],pop:[[330,0],[660,.05]]};
  const seq=seqs[kind]||seqs.tap,t0=actx.currentTime,vol=kind==='bad'?.07:.16;
  seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='bad'?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(vol,t0+d+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.2);o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.22);});
 }catch(e){}
}

function confetti(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const c=$('#fx'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
 c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 const cols=['#1F5FD6','#C9E52B','#F2B705','#1A9A5E','#FF7A1A','#7A4CC2','#E5484D'];
 const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
 const t0=performance.now();
 (function f(t){ctx.clearRect(0,0,innerWidth,innerHeight);const k=(t-t0)/2400;P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.globalAlpha=Math.max(0,1-k);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});if(k<1)requestAnimationFrame(f);else ctx.clearRect(0,0,innerWidth,innerHeight);})(t0);
}

function addXP(n,sk){
 if(doubleOn())n*=2;
 const t=today();
 S.xp+=n;S.days[t]=(S.days[t]||0)+n;S.day.xp+=n;
 leagueEnsure();S.league.me+=n;
 if(sk)S.skillXp[sk]=(S.skillXp[sk]||0)+n;
 let streakUp=false;
 if(S.last!==t){S.streak=(S.last===addDays(t,-1))?S.streak+1:1;S.last=t;S.best=Math.max(S.best,S.streak);streakUp=true;}
 let goal=false;
 if(!S.day.goalHit&&S.day.xp>=S.goal){S.day.goalHit=true;S.gems+=10;goal=true;}

 return{n,streakUp,goal};
}

/* ----- Personalisierung ----- */
function selfRating(){
 const out={};SKIDS.forEach(k=>{const r=S.journal.filter(j=>j.rt&&j.rt[k]).slice(0,5).map(j=>j.rt[k]);out[k]=r.length?r.reduce((a,b)=>a+b,0)/r.length:null;});return out;
}
function weakest(){
 const sr=selfRating(),lost={};S.journal.slice(0,8).forEach(j=>{if(j.lost)lost[j.lost]=(lost[j.lost]||0)+1;});
 const score=k=>(sr[k]??5)/2-(S.focus.includes(k)?.8:0)-(lost[k]||0)*.4+skLv(S.skillXp[k]).L*.15;
 return [...SKIDS].sort((a,b)=>score(a)-score(b));
}
function recommend(){
 for(const k of weakest()){const l=LESSONS.find(l=>l.sk===k&&unlocked(l.idx)&&stars(l.id)<3&&!(S.missions[l.id]&&S.missions[l.id].st==='active'));if(l)return{l,k};}
 return null;
}

function stageProg(si){const us=UNITS.filter(u=>u.si===si),ls=us.flatMap(u=>u.L),ms=STAGES[si].ms;
 const lD=ls.filter(l=>lessonDone(l.id)).length,tD=us.filter(u=>S.tests[u.id]).length,mD=ms.filter(m=>S.ms[m[0]]).length;
 const total=ls.length+us.length+ms.length,done=lD+tD+mD;return{lD,lT:ls.length,tD,tT:us.length,mD,mT:ms.length,done,total,pct:total?done/total:0};}
const stageDone=si=>{const p=stageProg(si);return p.tD===p.tT&&p.lD===p.lT&&p.mD>=p.mT-1;};
function curStage(){const c=LESSONS.find(l=>l.idx>=(LBYID[S.unlockId]||LESSONS[0]).idx&&unlocked(l.idx)&&!lessonDone(l.id));return c?UNITS[c.ui].si:STAGES.length-1;}

function radarSvg(vals){
 const n=SKIDS.length,cx=170,cy=150,R=105;

 let g='';[.2,.4,.6,.8,1].forEach(f=>{g+=`<polygon points="${SKIDS.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`;});
 SKIDS.forEach((k,i)=>{const [x,y]=pt(i,1);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1.5"/>`;const [tx,ty]=pt(i,1.2);g+=`<text x="${tx}" y="${ty+4}" text-anchor="middle">${esc(SK[k].s)}</text>`;});
 const has=SKIDS.some(k=>vals[k]!=null);
 if(has){const poly=SKIDS.map((k,i)=>pt(i,(vals[k]??0)/10).join(',')).join(' ');g+=`<polygon points="${poly}" fill="color-mix(in srgb,var(--accent) 28%,transparent)" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;SKIDS.forEach((k,i)=>{if(vals[k]!=null){const [x,y]=pt(i,vals[k]/10);g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`;}});}
 return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Selbsteinschätzung pro Skill">${g}</svg>`;

const entryTs=j=>j.ts||parseInt(j.id,36)||0;
function parseScore(str){const out=[];String(str||'').replace(/(\d{1,2})\s*[:\-–\/]\s*(\d{1,2})/g,(m,a,b)=>{out.push([+a,+b]);return m;});return out;}
function inferRes(score){const s=parseScore(score);if(!s.length)return null;const w=s.filter(([a,b])=>a>b).length,l=s.filter(([a,b])=>b>a).length;return w>l?'w':l>w?'l':null;}
function statRange(){const f=S.sf||'all';if(f==='all')return S.journal;const lim=addDays(today(),f==='30'?-30:-365);return S.journal.filter(j=>j.date>=lim);}
function recordOf(list){const r={w:0,l:0,d:0};list.forEach(j=>{if(r[j.res]!=null)r[j.res]++;});r.n=r.w+r.l+r.d;r.pct=r.n?Math.round(r.w/r.n*100):null;return r;}
const byDateAsc=(a,b)=>a.date.localeCompare(b.date)||entryTs(a)-entryTs(b);
function streaks(asc){let w=0,l=0,bw=0,bl=0;asc.forEach(j=>{if(j.res==='w'){w++;l=0;}else if(j.res==='l'){l++;w=0;}else{w=0;l=0;}bw=Math.max(bw,w);bl=Math.max(bl,l);});return{bw,bl,w,l};}
function ratingHist(k){return [...S.journal].filter(j=>j.rt&&j.rt[k]!=null).sort(byDateAsc).map(j=>j.rt[k]);}
function sparkSvg(v){if(v.length<2)return '';const W=110,H=30,pts=v.slice(-12).map((x,i,a)=>[(i/(a.length-1))*W,H-3-(x/10)*(H-6)]);return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="var(--accent)"/></svg>`;}

function devSeries(k,list){
 const pts=[...list].filter(j=>j.rt&&Object.keys(j.rt).length&&(k==='all'||j.rt[k]!=null)).sort(byDateAsc).map(j=>{const vs=Object.values(j.rt);return{j,v:k==='all'?vs.reduce((a,b)=>a+b,0)/vs.length:j.rt[k]};});
 pts.forEach((p,i)=>{const w=pts.slice(Math.max(0,i-2),i+1);p.avg=w.reduce((a,b)=>a+b.v,0)/w.length;});return pts;}
function devChart(k,list){
 const pts=devSeries(k,list),ref=k==='all'?[]:devSeries('all',list);
 if(pts.length<2)return `<p class="muted small b" style="text-align:center;padding:18px 0">${pts.length?'Noch ein Spiel mit Bewertung, dann siehst du hier deine Entwicklung.':'Für diesen Bereich gibt es im Zeitraum noch keine Bewertungen.'}</p>`;
 const W=340,H=230,L=28,Rr=12,T=12,B=26,ts=d=>parseD(d).getTime(),all=[...pts,...ref],t0=Math.min(...all.map(p=>ts(p.j.date))),t1=Math.max(...all.map(p=>ts(p.j.date))),span=Math.max(1,t1-t0);

 g+=`<text x="${L}" y="${H-6}" class="ax">${dt(pts.concat(ref).sort((a,b)=>byDateAsc(a.j,b.j))[0].j.date)}</text><text x="${W-Rr}" y="${H-6}" text-anchor="end" class="ax">${dt(pts.concat(ref).sort((a,b)=>byDateAsc(b.j,a.j))[0].j.date)}</text>`;
 if(ref.length>1){const lr=ref[ref.length-1];g+=`<path d="${line(ref)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="${Math.min(X(lr.j.date),W-Rr)}" y="${Y(lr.avg)+(lr.avg>pts[pts.length-1].avg?-8:16)}" text-anchor="end" class="ax b">Gesamt Ø</text>`;}
 g+=pts.map(p=>`<circle cx="${X(p.j.date)}" cy="${Y(p.v)}" r="3" fill="var(--accent)" opacity=".28"/>`).join('');

 g+=pts.map(p=>{const j=p.j,tip=`${fmtDate(j.date)} · ${j.type}${j.res?' · '+RES[j.res]:''}${j.opp?' vs '+j.opp:''}|Bewertung ${fmt1(p.v)} · Ø (3 Spiele) ${fmt1(p.avg)}`;return `<circle class="hit" cx="${X(j.date)}" cy="${Y(p.avg)}" r="14" fill="transparent" data-tip="${esc(tip)}"/>`;}).join('');
 const n=Math.min(3,Math.floor(pts.length/2)),av=a=>a.reduce((x,y)=>x+y.v,0)/a.length,first=av(pts.slice(0,n)),last=av(pts.slice(-n)),d=last-first;
 return `<div class="devwrap"><svg class="dev" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entwicklung ${esc(k==='all'?'Gesamtschnitt':SK[k].n)}: von ${fmt1(first)} auf ${fmt1(last)}">${g}</svg><div class="devtip" hidden></div></div>
 <div class="row small b"><span class="grow">Erste ${n} Spiele: <b>${fmt1(first)}</b> → letzte ${n}: <b>${fmt1(last)}</b></span><span style="color:${d>0.2?'var(--good)':d<-0.2?'var(--bad)':'var(--muted)'}">${d>0.2?'▲':d<-0.2?'▼':'▬'} ${d>0?'+':''}${fmt1(d)}</span></div>
 <p class="muted small b" style="margin:-4px 0 0">Linie = Schnitt der letzten 3 Spiele · helle Punkte = einzelne Bewertungen${ref.length>1?' · gestrichelt = dein Gesamtschnitt':''} · ${pts.length} Spiele</p>

}

/* ================= Spielstärke (Elo aus deinen Ergebnissen) =================
 Niveau-Skala 0–7. Unbekannte Gegner starten auf deinem Niveau und lernen mit jedem Match gegen sie dazu.
 Trägst du das Niveau von Gegnern/Partner ein, wird die Schätzung deutlich genauer. */
const L2R=l=>600+l*200,R2L=r=>Math.max(0,Math.min(7,(r-600)/200));
const oppKey=s=>(s||'').trim().toLowerCase();
function eloReplay(){
 const base=S.myLevel!=null&&S.myLevel!==''?+S.myLevel:[1,2,3,4][S.lvl||0];
 let R=L2R(base);const opp={},hist=[];let n=0;
 [...S.journal].filter(j=>j.res&&(j.type==='Match'||j.type==='Turnier')).sort(byDateAsc).forEach(j=>{
  const pr=j.pl!=null&&j.pl!==''?L2R(+j.pl):R,team=(R+pr)/2,k=oppKey(j.opp);
  let orr;if(j.ol!=null&&j.ol!=='')orr=L2R(+j.ol);else if(k){if(opp[k]==null)opp[k]=team;orr=opp[k];}else orr=team;
  const E=1/(1+Math.pow(10,(orr-team)/400));let Sx=j.res==='w'?1:j.res==='l'?0:.5;
  const sc=parseScore(j.score).filter(([a,b])=>Math.max(a,b)<=7);if(sc.length){const gw=sc.reduce((s,x)=>s+x[0],0),gl=sc.reduce((s,x)=>s+x[1],0);if(gw+gl)Sx=.75*Sx+.25*gw/(gw+gl);}
  const K=n<10?40:24,d=K*(Sx-E);R+=d;if(k&&(j.ol==null||j.ol===''))opp[k]-=d;n++;hist.push({date:j.date,R});});
 return{R,L:R2L(R),base,n,hist,opp};
}
function levelCard(){const E=eloReplay();if(!E.n)return `<div class="card stack"><div class="eyebrow muted">Spielstärke</div><p class="muted small b">Trag Matches mit Ergebnis ein – dann schätzt die App dein Niveau (0–7) aus Siegen, Niederlagen und Games.${S.myLevel==null?' Startwert: '+fmt1(E.base)+' (aus deiner Einstufung, im Profil änderbar).':''}</p></div>`;
 const before=E.hist.filter(h=>h.date<=addDays(today(),-30)).pop(),tr=before?R2L(E.R)-R2L(before.R):R2L(E.R)-E.base;
 const vs=[E.base,...E.hist.map(h=>R2L(h.R))],mn=Math.min(...vs)-.2,mx=Math.max(...vs)+.2,W=340,H=70,X=i=>8+i/(vs.length-1||1)*(W-16),Y=v=>H-6-(v-mn)/(mx-mn||1)*(H-12);
 return `<div class="card stack"><div class="row"><div class="grow"><div class="eyebrow muted">Geschätzte Spielstärke</div><div class="lvlbig">${fmt1(E.L)}<small> / 7</small></div></div><span class="b" style="color:${tr>0.05?'var(--good)':tr<-0.05?'var(--bad)':'var(--muted)'}">${tr>0.05?'▲':tr<-0.05?'▼':'▬'} ${tr>0?'+':''}${fmt1(tr)} <span class="muted small">30 Tage</span></span></div>
 <svg viewBox="0 0 ${W} ${H}" class="dev" aria-label="Verlauf der Spielstärke"><path d="${vs.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(vs.length-1)}" cy="${Y(vs[vs.length-1])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>
 <p class="muted small b" style="margin:0">Aus ${E.n} Matches berechnet (Start ${fmt1(E.base)}). Unbekannte Gegner zählen erst wie dein Niveau – trag beim Match das Niveau von Gegnern und Partner ein, dann wird's genauer.</p></div>`;}

/* ================= Erkenntnisse ================= */
function insights(L){
 const M=L.filter(j=>j.res==='w'||j.res==='l'),out=[];
 SKIDS.forEach(k=>{const p=M.filter(j=>j.rt&&j.rt[k]!=null);if(p.length<4)return;const vals=p.map(j=>j.rt[k]).sort((a,b)=>a-b),m=vals[Math.floor(vals.length/2)];
  const hi=p.filter(j=>j.rt[k]>=m),lo=p.filter(j=>j.rt[k]<m);if(hi.length<2||lo.length<2)return;
  const wh=hi.filter(j=>j.res==='w').length,wl=lo.filter(j=>j.res==='w').length,ph=Math.round(wh/hi.length*100),pl=Math.round(wl/lo.length*100);
  if(Math.abs(ph-pl)>=25)out.push({w:Math.abs(ph-pl),ic:SK[k].ic,c:ph>pl?'var(--good)':'var(--bad)',h:`Wenn deine <b>${esc(SK[k].p)}</b> bei ${m}+ liegen, gewinnst du <b>${wh} von ${hi.length}</b> (${ph} %) – sonst ${wl} von ${lo.length} (${pl} %).`});});
 out.sort((a,b)=>b.w-a.w);const res=out.slice(0,3);
 const losses=M.filter(j=>j.res==='l'&&j.lost);if(losses.length>=2){const c={};losses.forEach(j=>c[j.lost]=(c[j.lost]||0)+1);const [k,n]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(n>=2){const l=LESSONS.find(x=>x.sk===k&&unlocked(x.idx));res.push({ic:'target',c:'var(--bad)',h:`In <b>${n} von ${M.filter(j=>j.res==='l').length} Niederlagen</b> hast du die meisten Punkte bei <b>${esc(SK[k].n)}</b> verloren.`,a:l?`<button class="btn sm" data-act="lesson" data-id="${l.id}">Üben</button>`:''});}}
 const P=groupRecord(M,'partner').filter(x=>x.n>=3).sort((a,b)=>b.pct-a.pct);if(P.length){const b=P[0];res.push({ic:'user',c:'var(--good)',h:`Mit <b>${esc(b.name)}</b> gewinnst du am häufigsten: <b>${b.w} von ${b.n}</b> (${b.pct} %).`});}
 const rw=M.filter(j=>j.res==='w'&&j.rt&&Object.keys(j.rt).length),rl=M.filter(j=>j.res==='l'&&j.rt&&Object.keys(j.rt).length);
 if(rw.length>=2&&rl.length>=2){const av=a=>a.reduce((s,j)=>{const v=Object.values(j.rt);return s+v.reduce((x,y)=>x+y,0)/v.length;},0)/a.length,aw=av(rw),al=av(rl);if(aw-al>=.5)res.push({ic:'chart',c:'var(--accent)',h:`Nach Siegen bewertest du dich im Schnitt mit <b>${fmt1(aw)}</b>, nach Niederlagen mit <b>${fmt1(al)}</b>.`});}
 return{list:res,n:M.length};
}
function insightsCard(L){const I2=insights(L);
 if(!I2.list.length)return `<div class="card stack"><div class="eyebrow muted">Erkenntnisse</div><p class="muted small b">Ab etwa 4–6 Matches mit Ergebnis und Bewertung zeigt dir die App hier, was bei Siegen anders läuft als bei Niederlagen (bisher ${I2.n}).</p></div>`;
 return `<div class="card stack"><div class="eyebrow muted">Erkenntnisse aus ${I2.n} Matches</div>${I2.list.map(x=>`<div class="ins"><span class="ic" style="--c:${x.c}">${I[x.ic]||I.chart}</span><p class="grow">${x.h}</p>${x.a||''}</div>`).join('')}<p class="muted small b" style="margin:0">Zusammenhänge, keine Beweise – aber gute Hinweise, worauf du achten kannst.</p></div>`;}

/* ================= Match-Briefing ================= */
const toks=s=>oppKey(s).split(/\s*(?:&|\+|,|\/|\bund\b)\s*/).map(x=>x.trim()).filter(Boolean);
function briefData(opp,partner){
 const M=S.journal.filter(j=>j.res),ot=toks(opp),vs=ot.length?M.filter(j=>toks(j.opp).some(t=>ot.includes(t))):[],wp=partner?M.filter(j=>oppKey(j.partner)===oppKey(partner)):[];
 const sr=selfRating(),diff=[];if(vs.length){SKIDS.forEach(k=>{const v=vs.filter(j=>j.rt&&j.rt[k]!=null).map(j=>j.rt[k]);if(v.length&&sr[k]!=null)diff.push({k,d:v.reduce((a,b)=>a+b,0)/v.length-sr[k]});});diff.sort((a,b)=>a.d-b.d);}
 const lc={};vs.filter(j=>j.lost).forEach(j=>lc[j.lost]=(lc[j.lost]||0)+1);const lost=Object.entries(lc).sort((a,b)=>b[1]-a[1])[0];
 const E=eloReplay(),k=oppKey(opp);let prob=null;if(k&&E.opp[k]!=null){prob=Math.round(100/(1+Math.pow(10,(E.opp[k]-E.R)/400)));}
 return{vs,wp,rv:recordOf(vs),rp:recordOf(wp),weak:diff[0]&&diff[0].d<-.4?diff[0]:null,lost:lost&&lost[1]>=1?lost[0]:null,prob};
}
function briefSheet(){const b=S.brief&&S.brief.date===today()?S.brief:{opp:'',partner:''};
 const opps=[...new Set(S.journal.map(j=>(j.opp||'').trim()).filter(Boolean))],parts=[...new Set(S.journal.map(j=>(j.partner||'').trim()).filter(Boolean))];
 let h=`<div class="eyebrow muted">Vor dem Match</div><h2>Match-Briefing</h2>
 <div class="row"><div class="grow"><label class="lab" for="bopp">Gegner</label><input id="bopp" class="field" list="dl_opp" value="${esc(b.opp)}" placeholder="z. B. Ben & Jan"></div><div class="grow"><label class="lab" for="bpart">Partner/in</label><input id="bpart" class="field" list="dl_part" value="${esc(b.partner)}" placeholder="optional"></div></div>

 set(el){const k=el.dataset.k;let v=el.dataset.v;if(k==='goal'||k==='weekGoal')v=+v;if(k==='sound')v=v==='1';if(k==='arm')v=v==='1';S[k]=v;save();render();},
 focus(el){const k=el.dataset.k;if(S.focus.includes(k))S.focus=S.focus.filter(x=>x!==k);else if(S.focus.length<3){S.focus.push(k);const l=unlockSkill(k);if(l)toast('Freigeschaltet: <b>'+esc(l.t)+'</b>',I.sparkle);}else{toast('Maximal 3 Fokus-Skills',I.target);return;}save();render();},
 lvlInfo(){const lv=lvl(S.xp);modal(`<div class="center">${mascot('happy')}<h2>Level ${lv.L} · ${title(lv.L)}</h2><div class="goal" style="width:100%"><div class="bar blue"><i style="width:${lv.cur/lv.need*100}%"></i></div><span>${lv.cur}/${lv.need}</span></div><p class="muted b">Nächster Titel: ${(TITLES.find(t=>t[0]>lv.L)||['','Du bist eine Legende!'])[1]}${TITLES.find(t=>t[0]>lv.L)?' ab Level '+TITLES.find(t=>t[0]>lv.L)[0]:''}</p></div><button class="btn block" data-act="closeModal">OK</button>`);},
 streakInfo(){showStreak();},
 showStreak(){showStreak();},
 goalInfo(){modal(`<div class="center"><span class="ic" style="width:72px;height:72px;--c:var(--gold)">${I.target}</span><h2>Tagesziel: ${S.goal} XP</h2><div class="goal" style="width:100%"><div class="bar"><i style="width:${Math.min(100,S.day.xp/S.goal*100)}%"></i></div><span>${S.day.xp}/${S.goal}</span></div><p class="muted b">Lektion +15 · Fehlerfrei +5 · Drill +10 · Session +10–20 · Mission bis +30${doubleOn()?'<br>Doppel-XP aktiv!':''}</p></div><button class="btn block" data-act="closeModal">OK</button>`);},
 closeModal(){closeModal();},
 roadmap(){roadmapSheet();},
 stage(el){stageSheet(+el.dataset.si);},
 msAsk(el){const m=MSALL.find(x=>x.id===el.dataset.id);modal(`<div class="center">${mascot()}<h2>Ehrlich geschafft?</h2><p class="b">„${esc(m.t)}“</p><p class="muted b small">Skill-Checks zählen nur, wenn du sie wirklich auf dem Court geschafft hast.</p></div><button class="btn good block" data-act="msDone" data-id="${m.id}">${I.check} Ja, geschafft!</button><button class="linkbtn" data-act="stage" data-si="${m.si}">Noch nicht</button>`);},
 msDone(el){const m=MSALL.find(x=>x.id===el.dataset.id);if(!m||S.ms[m.id])return;const was=stageDone(m.si);S.ms[m.id]=today();S.gems+=15;const r=addXP(25,null);checkAch();render();beep('done');confetti();
  if(!was&&stageDone(m.si))modal(`<div class="center">${mascot('happy')}<h2>Stufe „${esc(STAGES[m.si].t)}“ gemeistert!</h2><p class="muted b">${m.si<STAGES.length-1?'Weiter geht\'s mit „'+esc(STAGES[m.si+1].t)+'“.':'Du hast die ganze Roadmap geschafft. Leyenda!'}</p></div><button class="btn block" data-act="closeModal">Vamos!</button>`);
  else stageSheet(m.si);toast('Skill-Check geschafft! +'+r.n+' XP · +15 Bälle',I.check);},
 closeModalBg(el,e){if(e.target===el)closeModal();},
 export(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const done=()=>toast('Code kopiert – gut aufbewahren!',I.check);
  if(navigator.clipboard)navigator.clipboard.writeText(code).then(done,()=>showCode(code));else showCode(code);},
 import(){modal(`<h2>Code einfügen</h2><p class="muted b small">Achtung: überschreibt deinen aktuellen Fortschritt.</p><textarea id="imp" class="field code" placeholder="Code hier einfügen"></textarea><button class="btn block" data-act="doImport">Laden</button><button class="linkbtn" data-act="closeModal">Abbrechen</button>`);},
 doImport(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(!o||typeof o!=='object'||!('xp' in o))throw 0;S=Object.assign(defaults(),o);save();closeModal();tick();render();toast('Fortschritt geladen!',I.check);}catch(e){toast('Ungültiger Code',I.x);}},
 reset(el){if(el.dataset.armed){try{localStorage.removeItem(KEY);}catch(e){}S=defaults();OB={step:0,name:'',lvl:null,side:null,focus:[],goal:20,weekGoal:2};save();render();return;}el.dataset.armed=1;el.textContent='Wirklich? Nochmal tippen zum Löschen';el.style.color='var(--bad)';},
 ob(el){const k=el.dataset.k;let v=el.dataset.v;if(k!=='side')v=+v;OB[k]=v;beep('tap');renderOnboarding();},
 obFocus(el){const k=el.dataset.k;if(OB.focus.includes(k))OB.focus=OB.focus.filter(x=>x!==k);else if(OB.focus.length<3)OB.focus.push(k);renderOnboarding();},
 obBack(){OB.step=Math.max(0,OB.step-1);renderOnboarding();},
 obNext(){if(OB.step===1){const n=$('#obname');OB.name=(n?n.value:OB.name).trim().slice(0,24);}
  if(OB.step<5){OB.step++;renderOnboarding();return;}
  Object.assign(S,{onb:true,name:OB.name,lvl:OB.lvl,side:OB.side,focus:OB.focus,goal:OB.goal,weekGoal:OB.weekGoal,unlockId:LEVELS[OB.lvl][2]});
  S.focus.forEach(unlockSkill);leagueEnsure();save();scrollCur=true;render();
  setTimeout(()=>{modal(`<div class="center">${mascot('happy')}<h2>Vamos${S.name?', '+esc(S.name):''}!</h2><p class="muted b">So funktioniert's:</p></div><div class="stack b"><div class="row"><span class="ic">${I.book}</span><span class="grow">Lektion lernen: Theorie + Quiz</span></div><div class="row"><span class="ic" style="--c:var(--good)">${I.target}</span><span class="grow">Mission im nächsten Match anwenden</span></div><div class="row"><span class="ic" style="--c:var(--u4)">${I.pen}</span><span class="grow">Match ins Tagebuch eintragen & Mission auswerten</span></div><div class="row"><span class="ic" style="--c:var(--flame)">${I.flame}</span><span class="grow">Jeden Tag etwas tun – Streak, Liga, Skills leveln</span></div></div><button class="btn block" data-act="closeModal">Los geht's</button>`);},250);}
};
function showCode(code){modal(`<h2>Dein Sicherungscode</h2><textarea class="field code" readonly onclick="this.select()">${esc(code)}</textarea><button class="btn block" data-act="closeModal">Fertig</button>`);}
function devTip(e){const c=e.target.closest&&e.target.closest('.hit');const wraps=document.querySelectorAll('.devtip');if(!c){wraps.forEach(t=>t.hidden=true);return;}const w=c.closest('.devwrap'),t=w.querySelector('.devtip'),[a,b]=c.dataset.tip.split('|');t.innerHTML=`<b>${esc(a)}</b><span>${esc(b)}</span>`;t.hidden=false;const r=w.getBoundingClientRect(),cr=c.getBoundingClientRect(),x=cr.left+cr.width/2-r.left;t.style.left=Math.max(4,Math.min(r.width-t.offsetWidth-4,x-t.offsetWidth/2))+'px';t.style.top=Math.max(0,cr.top-r.top-t.offsetHeight-4)+'px';}
document.addEventListener('pointerover',devTip);document.addEventListener('pointerdown',devTip);
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e);});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return;}
 if(!LS||LS.phase!=='quiz')return;
 if(e.key==='Enter'){e.preventDefault();if(LS.state==='ask'){const b=document.querySelector('[data-act="check"]');if(b&&!b.disabled)checkAnswer();}else nextQ();return;}
 const q=LS.queue[LS.qi];if(LS.state!=='ask')return;const n=parseInt(e.key);
 if(q.k==='mc'&&n>=1&&n<=q.opts.length){LS.sel=q.opts[n-1];drawLesson();}
 if(q.k==='tf'&&(n===1||n===2)){LS.sel=String(n===1);drawLesson();}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.onb&&!LS&&!JF){if(S.day.d!==today()){tick();render();}}});

/* ================= Start ================= */
const startMsgs=tick();
render();
if(S.onb)checkAch();
startMsgs.forEach((m,i)=>setTimeout(()=>toast(m[0],m[1]),400+i*700));
function gearCheckOnOpen(){if(!S.onb||$('#modal').innerHTML||LS||JF||PR)return;MQ=[];const g=gearDue().length&&S.gearAsked!==today(),b=backupDue()&&S.backupAsked!==today();if(g&&b)MQ.push(backupPopup);if(g)gearPopup();else if(b)backupPopup();}
setTimeout(gearCheckOnOpen,1200);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(gearCheckOnOpen,600);});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
</script>
</body>
</html>
