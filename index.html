<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Vamos! Spanisch</title>
<meta name="theme-color" content="#2350C2">
<meta name="description" content="Spanisch lernen – kostenlos und gamifiziert.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="¡Vamos!">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: eine schmale App-Spalte (max. 640px) – Kopfleiste, scrollender Lernpfad im Zickzack, Navigation unten. Farben: Azulejo-Kobalt, Safran, Chili. */
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --surface-2:#EDF1FA; --line:#DCE2EF;
  --fg:#18213D; --muted:#5A6484;
  --accent:#2350C2; --accent-ink:#FFFFFF;
  --gold:#F2B705; --gold-ink:#3A2A00; --gem:#1C9BE6; --heart:#E5484D; --flame:#FF7A1A;
  --good:#1A9A5E; --good-bg:#DDF5E8; --bad:#D23A3A; --bad-bg:#FCE4E4;
  --locked:#CFD5E3; --locked-ink:#8A93AD; --scrim:rgba(12,16,34,.55);
  --u1:#2350C2; --u2:#1C8F5F; --u3:#B4660A; --u4:#C8372A; --u5:#6E46B8; --u6:#0F7F92; --u7:#B43A72; --u8:#557F17;
  --font-display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1222; --surface:#151C31; --surface-2:#1C2540; --line:#29345480; --fg:#E7EBF7; --muted:#9CA6C6;
    --accent:#6A93F5; --accent-ink:#0D1222; --good:#3DCB86; --good-bg:#11372A; --bad:#FF6B6B; --bad-bg:#421A1E;
    --locked:#2A3453; --locked-ink:#6E7899; --gem:#4CB8F5; --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1222; --surface:#151C31; --surface-2:#1C2540; --line:#29345480; --fg:#E7EBF7; --muted:#9CA6C6;
  --accent:#6A93F5; --accent-ink:#0D1222; --good:#3DCB86; --good-bg:#11372A; --bad:#FF6B6B; --bad-bg:#421A1E;
  --locked:#2A3453; --locked-ink:#6E7899; --gem:#4CB8F5; --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
svg{flex:none}

.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:8px 12px;border-bottom:2px solid var(--line)}
.stat{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:600;font-size:18px;background:none;border:0;padding:6px 8px;border-radius:12px;font-variant-numeric:tabular-nums}
.stat:hover{background:var(--surface-2)}
.stat svg{width:26px;height:26px}
.c-flame{color:var(--flame)} .c-gem{color:var(--gem)} .c-heart{color:var(--heart)} .c-gold{color:var(--gold)} .c-muted{color:var(--muted)}
.stat.off .c-flame{color:var(--locked-ink)}
.flag{width:30px;height:21px;border-radius:5px;overflow:hidden;display:block;box-shadow:0 0 0 2px var(--line)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 40px;scroll-behavior:smooth}
.nav{display:flex;gap:4px;border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:2px solid transparent;border-radius:14px;padding:6px 2px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* Buttons */
.btn{--b:var(--accent);--ink:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 20px;font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;background:var(--b);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--b) 62%,#000);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 color-mix(in srgb,var(--b) 62%,#000)}
.btn:disabled{--b:var(--locked);--ink:var(--locked-ink);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.block{width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:12px}
.btn.good{--b:var(--good);--ink:#fff}
.btn.bad{--b:var(--bad);--ink:#fff}
.btn.gold{--b:var(--gold);--ink:var(--gold-ink)}
.btn.gemb{--b:var(--gem);--ink:#fff}
.btn svg{width:20px;height:20px}
.linkbtn{background:none;border:0;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:8px}
.linkbtn:hover{color:var(--accent)}

/* Hero */
.hero{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:24px}
.hero .lola{width:84px;height:84px}
.hero-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero-body p{margin:0;font-weight:700}
.goal{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted)}
.bar{flex:1;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .5s cubic-bezier(.3,1.4,.5,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.4)}
.bar.green i{background:var(--good)}
.bar.blue i{background:var(--accent)}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--fg)}
.chip svg{width:14px;height:14px}

/* Path */
.unit{margin-bottom:28px}
.unit-head{background:var(--c);color:#fff;border-radius:20px;padding:14px 16px 14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000)}
.unit-head .eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.unit-head h2{font-size:22px;margin-top:2px}
.unit-head .sub{font-size:13px;font-weight:700;opacity:.9}
.tipbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:14px;padding:9px 12px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.tipbtn svg{width:18px;height:18px}
.unit.locked .unit-head{--c:var(--locked);color:var(--locked-ink)}
.unit.locked .tipbtn{color:var(--locked-ink);border-color:var(--locked-ink);background:transparent}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:64px 10px}
.nodewrap{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center}
.node{scroll-margin:140px 0 60px;position:relative;width:74px;height:68px;border-radius:50%;border:0;background:var(--c);color:#fff;box-shadow:0 7px 0 color-mix(in srgb,var(--c) 58%,#000);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.node svg{width:34px;height:34px}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 58%,#000)}
.node:disabled{--c:var(--locked);color:var(--locked-ink);cursor:not-allowed}
.node.chest{border-radius:22px;width:78px;--c:var(--gold);color:var(--gold-ink)}
.node.chest.done{opacity:.55}
.node.test{width:86px;height:78px}
.node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:6px solid color-mix(in srgb,var(--c) 30%,transparent);animation:ring 1.6s ease-in-out infinite}
.node.chest.current::before{border-radius:28px}
@keyframes ring{50%{inset:-14px;opacity:.5}}
.startbubble{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--c);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.startbubble::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.stars{display:flex;gap:1px;margin-top:12px;color:var(--gold);height:16px}
.stars svg{width:16px;height:16px}
.stars .e{color:var(--locked)}
.nodelabel{font-size:12px;font-weight:800;color:var(--muted);margin-top:4px}
.finish{text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}

/* Generic cards & sections */
.sec-title{font-size:22px;margin:4px 0 12px}
.sec-sub{color:var(--muted);font-weight:700;margin:-6px 0 14px;font-size:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack > .bar{flex:none}
.row{display:flex;align-items:center;gap:12px}
.row > .grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.b{font-weight:800}
.banner{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;color:#fff;background:var(--c,var(--accent));margin-bottom:18px}
.banner .lola{width:72px;height:72px}
.banner h2{font-size:24px}
.banner p{margin:4px 0 0;font-weight:700;opacity:.92}

/* Quests */
.quest .q-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.quest .q-ic svg{width:26px;height:26px}
.quest h3{font-size:17px;font-family:var(--font-body);font-weight:800}
.qbar{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.achc{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.achc .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;background:var(--mc,var(--locked))}
.achc h3{font-size:16px}
.achc .lvl{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* League */
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font-weight:800}
.lrow.me{background:color-mix(in srgb,var(--accent) 14%,transparent);outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.lrank{width:28px;text-align:center;font-family:var(--font-display);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.lrank.top{color:var(--good)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;flex:none}
.lxp{font-variant-numeric:tabular-nums;color:var(--muted)}
.zone{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:6px 4px}
.zone::before,.zone::after{content:"";flex:1;height:2px;background:currentColor;opacity:.4}
.zone.up{color:var(--good)} .zone.down{color:var(--bad)}
.tiers{display:flex;gap:10px;justify-content:center;margin:6px 0 16px;flex-wrap:wrap}
.tier{width:44px;height:50px;display:grid;place-items:center;color:var(--tc);opacity:.35}
.tier.on{opacity:1;transform:scale(1.2)}
.tier svg{width:40px;height:44px}

/* Shop */
.item{display:flex;align-items:center;gap:14px}
.item .pic{width:64px;height:64px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.item .pic svg{width:40px;height:40px}
.item .pic .lola{width:60px;height:60px}
.item h3{font-size:17px;font-family:var(--font-body);font-weight:800}
.item p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.price svg{width:18px;height:18px}

/* Profile */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sg{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}
.sg svg{width:26px;height:26px}
.sg b{display:block;font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sg span{font-size:13px;color:var(--muted);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:18px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .col i{display:block;width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px;position:relative}
.chart .col i.today{background:var(--gold)}
.chart .col em{font-style:normal;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.chart .col span{font-size:12px;font-weight:800;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.field{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-weight:700}
textarea.field{min-height:84px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:400}
.profile-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.profile-head .lola{width:110px;height:110px;background:var(--surface-2);border-radius:28px;padding:6px}
.lvl-badge{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* Lesson overlay */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:760px;width:100%;margin:0 auto}
.l-top .bar{height:18px}
.l-top .bar i{background:var(--good)}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px;border-radius:10px;display:grid;place-items:center}
.iconbtn svg{width:26px;height:26px}
.iconbtn:hover{background:var(--surface-2)}
.l-hearts{display:flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--heart);min-width:46px}
.l-hearts svg{width:26px;height:26px}
.l-hearts.inf{color:var(--accent)}
.combo{height:30px;display:flex;justify-content:center;align-items:center}
.combo span{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--flame);letter-spacing:.04em;text-transform:uppercase;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.combo svg{width:20px;height:20px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.l-body{flex:1;overflow-y:auto;padding:4px 16px 24px}
.l-inner{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.l-inner.locked{pointer-events:none}
.ex-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--u5)}
.ex-title{font-size:26px;font-weight:700}
.say{display:flex;align-items:flex-end;gap:10px}
.say .lola{width:92px;height:92px;flex:none}
.saybub{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:20px;min-width:0;background:var(--surface)}
.saybub::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.spk{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.spk svg{width:24px;height:24px}
.spk:active{transform:translateY(3px);box-shadow:none}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:16px;padding:10px 0}
.spk.big{width:120px;height:110px;border-radius:26px;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.spk.big svg{width:56px;height:56px}
.spk.slow{width:76px;height:70px;border-radius:20px;font-family:var(--font-display);font-weight:700;font-size:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);font-size:18px;font-weight:700;transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt .k{display:inline-grid;place-items:center;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted);flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.opt[aria-pressed="true"] .k{border-color:var(--accent);color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt.pick{flex-direction:column;justify-content:center;text-align:center;padding:16px 8px 12px;gap:8px}
.opt.pick .emo{font-size:56px;line-height:1.1}
.opt.pick .k{position:absolute;margin:-6px 0 0 -6px}
.opt.pick{position:relative}
.opt.pick .k{top:12px;left:12px;margin:0}
.answer-line{min-height:124px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:6px 0;background:repeating-linear-gradient(to bottom,transparent 0 58px,var(--line) 58px 60px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:9px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);font-size:18px;font-weight:700;animation:pop .18s}
.tile.ghost{background:var(--surface-2);color:transparent;border-color:var(--surface-2);pointer-events:none;animation:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mbtn{padding:14px 10px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);font-size:17px;font-weight:700;min-height:60px;overflow-wrap:anywhere}
.mbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.mbtn.ok{border-color:var(--good);color:var(--good);background:var(--good-bg);opacity:.5;pointer-events:none;transition:opacity .4s .25s}
.mbtn.no{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.typebox{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:16px;padding:16px;font-size:20px;font-weight:700;min-height:120px;resize:none}
.typebox:focus{outline:none;border-color:var(--accent)}
.acc{display:flex;flex-wrap:wrap;gap:6px}
.acc button{min-width:42px;padding:8px 10px;border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;background:var(--surface);font-weight:800;font-size:17px}
.l-foot{border-top:2px solid var(--line);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transition:background .2s}
.l-foot.good{background:var(--good-bg);border-color:transparent}
.l-foot.bad{background:var(--bad-bg);border-color:transparent}
.foot-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fb{display:flex;gap:12px;align-items:flex-start;animation:pop .25s}
.fb .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.fb .ic svg{width:26px;height:26px}
.fb h3{font-size:23px}
.fb p{margin:2px 0 0;font-weight:700}
.l-foot.good .fb{color:var(--good)} .l-foot.bad .fb{color:var(--bad)}
.foot-row{display:flex;gap:10px;align-items:center}
.foot-row .btn{flex:1}

/* Results */
.results{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:12px}
.results .lola{width:150px;height:150px;animation:hop 1s ease-in-out 2}
@keyframes hop{30%{transform:translateY(-16px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.results h1{font-size:32px;color:var(--gold)}
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.ts{border:2px solid var(--tc);border-radius:16px;overflow:hidden;background:var(--tc)}
.ts b{display:block;color:#fff;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:5px 2px}
.ts span{display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 4px;font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--tc);background:var(--surface);border-radius:13px 13px 0 0;font-variant-numeric:tabular-nums}
.ts span svg{width:20px;height:20px}
.bigstars{display:flex;gap:6px;color:var(--gold)}
.bigstars svg{width:46px;height:46px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}
.bigstars svg:nth-child(2){animation-delay:.15s} .bigstars svg:nth-child(3){animation-delay:.3s}
.bigstars .e{color:var(--locked)}
.rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.streakbig{display:flex;flex-direction:column;align-items:center;gap:6px}
.streakbig svg{width:140px;height:140px;color:var(--flame);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.streakbig .n{font-family:var(--font-display);font-size:72px;font-weight:700;color:var(--flame);line-height:1}
.week{display:flex;gap:8px;justify-content:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.week i{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:#fff}
.week i.on{background:var(--flame)}
.week i svg{width:16px;height:16px}

/* Modal, toasts */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:end center;z-index:80;padding:16px}
.sheet{background:var(--surface);color:var(--fg);border-radius:24px;padding:22px;width:100%;max-width:460px;max-height:85vh;overflow:auto;animation:up .25s cubic-bezier(.3,1.3,.5,1);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:24px}
.sheet p{margin:0}
.sheet .center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.sheet .bigic{width:84px;height:84px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){.modal{place-items:center}}
.tip{border-left:4px solid var(--c,var(--accent));padding:4px 0 4px 12px}
.tip h3{font-size:17px;font-family:var(--font-body);font-weight:900}
.tip p{margin:4px 0 0}
.tip .ex{margin-top:6px;font-weight:700;color:var(--muted);font-size:14px}
.tip .ex b{color:var(--fg)}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(calc(100vw - 32px),420px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:drop .3s cubic-bezier(.3,1.4,.5,1)}
.toast svg{width:22px;height:22px;flex:none}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:120;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (max-width:420px){
  .stat{font-size:16px;padding:6px 4px;gap:4px}
  .stat svg{width:22px;height:22px}
  .ex-title{font-size:22px}
  .say .lola{width:70px;height:70px}
  .opt.pick .emo{font-size:46px}
}

const norm=s=>s.toLowerCase().replace(/[¿?¡!.,;:"'«»…]/g,' ').replace(/\s+/g,' ').trim();
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');

function judge(input,accepted){
 const n=norm(input);
 for(const a of accepted) if(norm(a)===n) return {ok:true};
 for(const a of accepted) if(deacc(norm(a))===deacc(n)) return {ok:true,accent:a};
 return {ok:false};
}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

function standings(weekKey,tier,frac){

 return names.map((n,i)=>{const total=Math.round((35+r()*300)*(1+tier*.55));const ex=.7+r()*.7;return {name:n,xp:Math.floor(total*Math.pow(frac,ex)),bot:true,col:`var(--u${(i%8)+1})`};});

function tick(silent){
 const now=Date.now(),today=dayKey();
 if(S.hearts<MAXH){while(S.hearts<MAXH&&now-S.heartTs>=REGEN){S.hearts++;S.heartTs+=REGEN;}if(S.hearts>=MAXH)S.heartTs=now;}
 if(S.day!==today){S.day=today;S.dayXp=0;}
 if(S.last&&dayDiff(S.last,today)>1){
  const missed=dayDiff(S.last,today)-1;
  if(S.streak>0&&S.freezes>=missed){S.freezes-=missed;S.last=dayKey(new Date(now-864e5));if(!silent)toast(`Streak-Schutz eingesetzt – dein Streak von ${S.streak} Tagen bleibt.`,I.snow);}
  else{if(S.streak>0&&!silent)toast(`Dein Streak ist abgelaufen. Heute startest du neu!`,I.flame);S.streak=0;}
 }
 if(!S.quests||S.quests.day!==today)S.quests=genQuests();
 const wk=dayKey(weekStart());
 if(S.week!==wk){
  if(S.week&&S.weekXp>0){
   const b=standings(S.week,S.tier,1);b.push({me:true,xp:S.weekXp});b.sort((a,b)=>b.xp-a.xp||(a.me?-1:1));
   const rank=b.findIndex(x=>x.me)+1;
   if(rank<=3&&S.tier<LEAGUES.length-1){S.tier++;S.gems+=30;toast(`Aufgestiegen! Platz ${rank} – willkommen in der Liga ${LEAGUES[S.tier].n}. +30 Gems`,I.shield);}

function distract(w,pool,n){
 const c=shuffle(pool.filter(x=>x.es!==w.es&&first(x.de)!==first(w.de)&&x.e!==w.e));
 const out=c.slice(0,n);
 if(out.length<n)out.push(...shuffle(ALLWORDS.filter(x=>x.es!==w.es&&!out.includes(x))).slice(0,n-out.length));
 return out;
}
function tokens(s){const t=s.replace(/[¿?¡!.,;:]/g,'').split(/\s+/).filter(Boolean);if(t.length)t[0]=t[0].charAt(0).toLowerCase()+t[0].slice(1);return t;}
function makeTiles(s,lang,pool){
 const tk=tokens(first(s[lang]));const have=new Set(tk.map(norm));
 const extra=shuffle([...new Set(pool.filter(x=>x!==s).flatMap(x=>tokens(first(x[lang]))))].filter(w=>!have.has(norm(w)))).slice(0,tk.length>6?2:3);
 return shuffle([...tk,...extra]).map((w,i)=>({id:i,w}));
}
function buildPlan(plan,W,Sn,wpool,spool){
 let wq=[],sq=[];
 const nw=()=>{if(!wq.length)wq=shuffle(W);return wq.pop();};
 const ns=()=>{if(!sq.length)sq=shuffle(Sn);return sq.pop();};
 return plan.map(t=>{
  if(['build','build_de','listen_build','type_sent'].includes(t)&&!Sn.length)t=rand(['mc_es','mc_de','type_word']);
  if(t==='listen_word'&&!canSpeak())t='mc_es';
  if(t==='listen_build'&&!canSpeak())t='build_de';
  if(['pick','mc_es','mc_de','listen_word','type_word'].includes(t)){const w=nw();return {t,w,opts:t==='type_word'?null:shuffle([w,...distract(w,wpool,t==='pick'?3:2)])};}
  if(t==='match'){const seen=new Set();const pairs=shuffle(W.length>=5?W:wpool).filter(w=>{const k=first(w.de);if(seen.has(k))return false;seen.add(k);return true;}).slice(0,5);return {t,pairs};}
  const s=ns();const lang=t==='build_de'?'de':'es';
  return {t,s,lang,tiles:t==='type_sent'?null:makeTiles(s,lang,spool)};
 });
}
function genLesson(u,kind){
 const un=UNITS[u];let W=un.words,Sn=un.sents;
 if(kind===0){W=un.words.slice(0,6);Sn=[];}
 else if(kind===1){W=un.words.slice(6);Sn=un.sents.slice(0,3);}
 const plan=kind==='test'?shuffle(PLANS.test):PLANS[kind];
 return buildPlan(plan,W,Sn,un.words,un.sents);
}
function genPractice(){
 const ci=curIdx(),maxU=ci>=FLAT.length?UNITS.length-1:FLAT[ci].u;
 const words=[],sents=[];
 for(let u=0;u<=maxU;u++){words.push(...UNITS[u].words);sents.push(...UNITS[u].sents);}
 const sc=w=>{const s=S.words[w.es]||{c:0,w:0};return (s.w+1)/(s.c+1)+Math.random()*.6;};
 const known=words.filter(w=>S.words[w.es]);
 const base=known.length>=6?known:words;
 const W=base.map(w=>[sc(w),w]).sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
 const Sn=shuffle(sents.filter(s=>s.u<=maxU)).slice(0,6);
 return buildPlan(shuffle(PLANS.practice),W,Sn,words,sents);
}

function wordStat(w,ok){const s=S.words[w.es]||(S.words[w.es]={c:0,w:0});ok?s.c++:s.w++;}
function check(){
 if(!L||L.answered||L.done)return;
 const ex=L.ex;let r,sol,solEs=null;
 if(['pick','mc_es','mc_de','listen_word'].includes(ex.t)){
  if(L.sel==null)return;
  r={ok:ex.opts[L.sel]===ex.w};
  sol=ex.t==='mc_es'||ex.t==='listen_word'?`${ex.w.es} = ${first(ex.w.de)}`:ex.w.es;solEs=ex.w.es;
 }else if(ex.t==='type_word'||ex.t==='type_sent'){
  const v=$('#ans').value;if(!v.trim())return;
  const acc=ex.t==='type_word'?[...alts(ex.w.es),...alts(ex.w.es).map(dropArt)]:alts(ex.s.es);
  r=judge(v,acc);sol=ex.t==='type_word'?ex.w.es:first(ex.s.es);solEs=sol;
 }else{
  if(!L.picked.length)return;
  r=judge(L.picked.map(id=>ex.tiles[id].w).join(' '),alts(ex.s[ex.lang]));
  sol=first(ex.s[ex.lang]);solEs=first(ex.s.es);
 }
 result(r,sol,solEs);
}
function result(r,sol,solEs){
 const ex=L.ex;L.answered=true;
 const inner=$('#linner');if(inner)inner.classList.add('locked');
 if(r.ok){
  L.correct++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo);beep('ok');
  if(ex.t.startsWith('listen'))questProg('listen',1);
  if(ex.t.startsWith('build')||ex.t==='listen_build')questProg('build',1);
  if(ex.t.startsWith('type'))questProg('type',1);
 }else{
  L.mistakes++;L.combo=0;beep('bad');
  if(!L.practice)loseHeart();
  const again=Object.assign({},ex,{again:true});
  if(again.tiles)again.tiles=shuffle(again.tiles).map((t,i)=>({id:i,w:t.w}));
  if(again.opts)again.opts=shuffle(again.opts);
  L.queue.push(again);
  if(solEs&&ex.t!=='build_de')setTimeout(()=>speak(solEs),200);
 }
 if(ex.w)wordStat(ex.w,r.ok);
 lessonTop();save();
 const f=$('#lfoot');f.className='l-foot '+(r.ok?'good':'bad');
 const head=r.ok?(L.combo>=5&&L.combo%5===0?`¡${L.combo} seguidas!`:rand(PRAISE)):'Leider falsch';
 let msg='';
 if(r.ok&&r.accent)msg=`Achte auf die Akzente: <b>${esc(r.accent)}</b>`;

 f.innerHTML=`<div class="foot-in"><div class="fb"><span class="ic">${r.ok?I.check:I.x}</span><div><h3>${head}</h3>${msg?`<p>${msg}</p>`:''}</div></div><button class="btn block ${r.ok?'good':'bad'}" id="contBtn" data-act="cont">Weiter</button></div>`;
 setTimeout(()=>{const b=$('#contBtn');if(b)try{b.focus({preventScroll:true});}catch(e){}},30);
}

  const lb=$(`.mbtn[data-side="l"][data-k="${L.m.l}"]`),rb=$(`.mbtn[data-side="r"][data-k="${L.m.r}"]`);

   [lb,rb].forEach(b=>{b.classList.add('ok');b.setAttribute('aria-pressed','false');b.disabled=true;});

   }

   L.m.mist++;L.mistakes++;L.combo=0;beep('bad');wordStat(L.ex.pairs[L.m.l],false);lessonTop();

 }
}

 untile(el){if(L.answered)return;L.picked=L.picked.filter(x=>x!==+el.dataset.id);renderTiles();},
 m(el){if(!L.answered)matchTap(el);},
 acc(el){const ta=$('#ans');if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd;ta.value=ta.value.slice(0,s)+el.dataset.c+ta.value.slice(e);ta.focus();ta.selectionStart=ta.selectionEnd=s+1;setReady(true);},
 check(){check();},
 cont(){next();},
 skip(){if(L.answered)return;L.correct++;L.combo=0;lessonTop();next();},
 resultsNext(){if(L.streakUp){streakScreen();return;}closeLesson();},
 quit(){
  if(!L)return;
  if(L.done){closeLesson();return;}
  modal(`<div class="center">${mascot(100,S.wear,'sad')}<h2>Wirklich aufhören?</h2><p class="muted b">Dein Fortschritt in dieser Lektion geht verloren.</p></div><button class="btn block" data-act="close">Weiterlernen</button><button class="btn block ghost" data-act="endLesson" style="color:var(--bad)">Beenden</button>`);
 },
 endLesson(){closeModal();closeLesson();},
 buyRefill(){if(S.gems<50)return;S.gems-=50;S.hearts=MAXH;S.heartTs=Date.now();save();beep('coin');closeModal();toast('Herzen aufgefüllt!',I.heart);if(L&&!L.done){lessonTop();next();}else render();},
 practiceFromHearts(){closeModal();if(L){$('#lesson').hidden=true;L=null;}startPractice();},
 claimChest(el){S.done[el.dataset.key]=1;S.gems+=+el.dataset.g;save();beep('coin');confetti();closeModal();toast(`+${el.dataset.g} Gems`,I.gem);render();},
 claimQuest(el){const q=S.quests.list[+el.dataset.i];if(!q||q.claimed||q.p<q.t)return;q.claimed=true;const g=questGems(q);S.gems+=g;save();beep('coin');toast(`+${g} Gems`,I.gem);render();},
 claimBonus(){if(S.quests.bonus||!S.quests.list.every(x=>x.claimed))return;S.quests.bonus=true;S.gems+=30;save();beep('coin');confetti();toast('Bonustruhe: +30 Gems',I.chest);render();},
 buy(el){
  const it=ITEMS.find(x=>x.id===el.dataset.id);if(!it||S.gems<it.price)return;
  if(it.id==='refill'){if(S.hearts>=MAXH)return;S.hearts=MAXH;S.heartTs=Date.now();}
  else if(it.id==='freeze'){if(S.freezes>=2)return;S.freezes++;}
  else if(it.id==='double'){S.doubleUntil=Math.max(Date.now(),S.doubleUntil)+15*6e4;}
  else{if(S.owned.includes(it.id))return;S.owned.push(it.id);S.wear[it.slot]=it.id;}
  S.gems-=it.price;S.bought++;save();beep('coin');toast(`${it.name} gekauft`,I.bag);checkAch();render();
 },
 wear(el){const it=ITEMS.find(x=>x.id===el.dataset.id);if(S.wear[it.slot]===it.id)delete S.wear[it.slot];else S.wear[it.slot]=it.id;save();beep('tap');render();},
 goal(el){S.goal=+el.dataset.v;save();render();},
 sound(el){S.sound=el.dataset.v==='1';save();render();beep('tap');},
 rate(el){S.rate=+el.dataset.v;save();render();speak('¡Hola! ¿Qué tal?');},
 installInfo(){modal(installCard().replace('margin-top:24px','margin-top:0')+'<button class="btn block" data-act="close">Alles klar</button><button class="linkbtn" data-act="hideInstall">Nicht mehr anzeigen</button>');},
 hideInstall(){S.hideInstall=true;save();closeModal();render();},
 install(){if(!installEvt)return;closeModal();installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render();});},
 export(){
  let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));}catch(e){}
  $('#exportBox').innerHTML=`<textarea class="field" id="exportField" readonly>${esc(code)}</textarea><button class="btn sm" data-act="copy" style="margin-top:8px">Kopieren</button>`;
 },
 copy(){const f=$('#exportField');const ok=()=>toast('Code kopiert',I.check);try{navigator.clipboard.writeText(f.value).then(ok,()=>{f.select();toast('Code markiert – jetzt kopieren',I.pen);});}catch(e){f.select();toast('Code markiert – jetzt kopieren',I.pen);}},
 import(){
  const v=$('#importField').value.trim();if(!v)return toast('Füge zuerst einen Sicherungscode ein.',I.pen);
  try{const o=JSON.parse(decodeURIComponent(escape(atob(v))));if(typeof o!=='object'||o===null||typeof o.xp!=='number')throw 0;S=Object.assign(defaults(),o);S.tab='profile';tick(true);save();render();toast('Fortschritt geladen',I.check);}
  catch(e){toast('Der Code ist ungültig. Prüfe, ob du ihn vollständig kopiert hast.',I.x);}
 },
 reset(el){
  if(el.dataset.armed){try{localStorage.removeItem(KEY);}catch(e){}S=defaults();tick(true);save();scrollCur=true;render();toast('Alles zurückgesetzt. ¡Empezamos de nuevo!',I.check);return;}
  el.dataset.armed='1';el.textContent='Sicher? Nochmal tippen zum Löschen';el.classList.remove('ghost');el.classList.add('bad');el.style.color='';
 }
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el){if(e.target.id==='modal')closeModal();return;}
 if(el.disabled)return;
 const f=ACT[el.dataset.act];if(f)f(el);
});
document.addEventListener('change',e=>{if(e.target.id==='nameInput'){S.name=e.target.value.trim().slice(0,20);save();renderTop();}});
document.addEventListener('keydown',e=>{
 if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return;}
 if(!L||$('#lesson').hidden)return;
 if(e.key==='Enter'){
  if(e.target.id==='quitBtn')return;
  e.preventDefault();
  if(L.done){ACT.resultsNext();return;}
  if(L.answered)next();else check();
  return;
 }
 if(e.key==='Escape'){ACT.quit();return;}
 if(e.target.tagName==='TEXTAREA'||L.answered)return;
 const n=parseInt(e.key,10);
 if(n>=1&&n<=4){const b=$(`.opt[data-i="${n-1}"]`);if(b)ACT.sel(b);}
});

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
tick(false);
if(S.tab&&!VIEWS[S.tab])S.tab='learn';
render();
setInterval(()=>{const h=S.hearts,d=S.day;tick(false);if(h!==S.hearts||d!==S.day){renderTop();}},20000);
})();
</script>
</body>
</html>
