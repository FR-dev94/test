name: PadelUp-Tests

on:
  push:
    paths: ['padel/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/padel-tests.yml']
  pull_request:
    paths: ['padel/**', 'package.json', 'package-lock.json', 'playwright.config.js', '.github/workflows/padel-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
